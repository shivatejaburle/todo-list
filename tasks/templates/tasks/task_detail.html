{% extends 'base_master.html' %}
{% block content %}
<div class="container">
    <h1>{{ task.title }}</h1>
    <div class="card">
        <div class="card-body">
            <p class="card-text"><strong>Description:</strong><br> {{ task.description }}</p>
            <p class="card-text"><strong>Status:</strong><br> {{ task.status }}</p>
            <p class="card-text"><strong>Date and Time:</strong><br> {{ task.date }}</p>
        </div>
    </div>
    <p class="mt-3">
        <a class="btn btn-secondary" href="{% url 'tasks:task_list' %}" role="button">Back</a>
        <a class="btn btn-primary" href="{% url 'tasks:task_update' task.id %}" role="button">Edit</a>
        <a class="btn btn-success" href="{% url 'tasks:task_complete' task.id %}" role="button">Complete</a>
        <a class="btn btn-danger" href="{% url 'tasks:task_delete' task.id %}" role="button">Delete Task</a>
    </p>
</div>
{% endblock %}
