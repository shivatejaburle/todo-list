{% load static %}
<nav class="navbar navbar-expand-sm navbar-dark bg-dark" aria-label="ToDo App Navbar">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">
      <img src="{% static 'tasks/img/logo.png' %}" alt="Logo" width="24" class="d-inline-block align-text-top">
      <span class="">ToDo List</span>
    </a>
    <button class="navbar-toggler border border-light" type="button" data-bs-toggle="collapse" data-bs-target="#navbar" aria-controls="navbar" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbar">
      <ul class="navbar-nav me-auto mb-2 mb-sm-0">
        <li class="nav-item">
            <a class="nav-link" href="{%url 'tasks:index' %}">Home</a>            
        </li>
        {% if request.user.is_authenticated %}
          <li class="nav-item">
              <a class="nav-link" href="{%url 'tasks:task_list' %}">Tasks</a>            
          </li>
        {% endif %}
      </ul>

      <hr class="text-light">
      <ul class="navbar-nav mb-2 mb-sm-0">
        <li class="nav-item">
            {% if request.user.is_authenticated %}
              {% if request.user.is_superuser %}
                <a class="btn btn-outline-light m-1" href="/admin" target="_blank">Django Administration</a>
              {% endif %}
              <a class="btn btn-danger m-1" href="{% url 'account_logout' %}">Logout</a>
            {% else %}
              <a class="btn btn-outline-light m-1" href="{% url 'account_login' %}">Login</a>
              <a class="btn btn-warning m-1" href="{% url 'account_signup' %}">Sign Up</a>
            {% endif %}
        </li>
      </ul>
    </div>
  </div>
</nav>
